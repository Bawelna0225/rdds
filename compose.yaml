name: rdds

x-sensor-agent-environment: &sensor-agent-environment
  RDDS_API_URL: http://api:8000
  RDDS_LOG_LEVEL: ${RDDS_LOG_LEVEL:-INFO}
  RDDS_AGENT_SENSOR_ID: ${RDDS_AGENT_SENSOR_ID:-skyspy-sensor-01}
  RDDS_AGENT_DISPLAY_NAME: ${RDDS_AGENT_DISPLAY_NAME:-Sky-Spy receiver}
  RDDS_AGENT_SENSOR_TOKEN: '${RDDS_AGENT_SENSOR_TOKEN:-}'
  RDDS_AGENT_SENSOR_LAT: '${RDDS_AGENT_SENSOR_LAT:-}'
  RDDS_AGENT_SENSOR_LON: '${RDDS_AGENT_SENSOR_LON:-}'
  RDDS_AGENT_TRANSPORT: ${RDDS_AGENT_TRANSPORT:-unknown}
  RDDS_SKYSPY_BAUD_RATE: ${RDDS_SKYSPY_BAUD_RATE:-115200}
  RDDS_AGENT_HEARTBEAT_SECONDS: ${RDDS_AGENT_HEARTBEAT_SECONDS:-10}
  RDDS_AGENT_RECONNECT_SECONDS: ${RDDS_AGENT_RECONNECT_SECONDS:-3}
  RDDS_AGENT_REQUEST_TIMEOUT_SECONDS: ${RDDS_AGENT_REQUEST_TIMEOUT_SECONDS:-5}
  RDDS_AGENT_REPLAY_MESSAGES_PER_SECOND: ${RDDS_AGENT_REPLAY_MESSAGES_PER_SECOND:-2}
  RDDS_AGENT_MAX_QUEUE_MESSAGES: ${RDDS_AGENT_MAX_QUEUE_MESSAGES:-250000}
  RDDS_AGENT_SPOOL_PATH: /var/lib/rdds-agent/outbox.sqlite3

x-sensor-agent-service: &sensor-agent-service
  build:
    context: ./sensor-agent
  restart: unless-stopped
  read_only: true
  tmpfs:
    - /tmp:size=8m,mode=1777
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  networks:
    - backend

services:
  database:
    image: postgis/postgis:16-3.5-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - rdds-database-data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    networks:
      - backend

  migrate:
    image: postgis/postgis:16-3.5-alpine
    restart: "no"
    environment:
      PGHOST: database
      PGPORT: 5432
      PGDATABASE: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      PGUSER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - ./database/migrations:/migrations:ro
    entrypoint:
      - /bin/sh
      - -ec
    command:
      - |
        psql -v ON_ERROR_STOP=1 <<'SQL'
        CREATE TABLE IF NOT EXISTS rdds_schema_migrations (
            migration_name TEXT PRIMARY KEY,
            checksum TEXT NOT NULL CHECK (char_length(checksum) = 64),
            applied_at TIMESTAMPTZ NOT NULL DEFAULT NOW(),
            CHECK (migration_name ~ '^[0-9]{3}_[A-Za-z0-9_.-]+[.]sql$')
        );
        SQL

        for migration in /migrations/*.sql; do
          migration_name=$${migration##*/}
          case "$${migration_name}" in
            *[!A-Za-z0-9_.-]*)
              echo "Invalid migration filename: $${migration_name}" >&2
              exit 2
              ;;
          esac
          case "$${migration_name}" in
            [0-9][0-9][0-9]_*.sql) ;;
            *)
              echo "Invalid migration filename: $${migration_name}" >&2
              exit 2
              ;;
          esac

          checksum=$$(sha256sum "$${migration}" | cut -d ' ' -f 1)
          recorded_checksum=$$(
            psql -v ON_ERROR_STOP=1 -Atc \
              "SELECT checksum FROM rdds_schema_migrations WHERE migration_name = '$${migration_name}'"
          )

          if [ -n "$${recorded_checksum}" ]; then
            if [ "$${recorded_checksum}" != "$${checksum}" ]; then
              echo "Checksum mismatch for applied migration: $${migration_name}" >&2
              exit 3
            fi
            echo "Skipping applied migration $${migration_name}"
            continue
          fi

          echo "Applying $${migration}"
          psql -v ON_ERROR_STOP=1 -f "$${migration}"
          psql -v ON_ERROR_STOP=1 -c \
            "INSERT INTO rdds_schema_migrations (migration_name, checksum) VALUES ('$${migration_name}', '$${checksum}')"
        done
    depends_on:
      database:
        condition: service_healthy
    networks:
      - backend

  api:
    build:
      context: ./server/api
    restart: unless-stopped
    environment:
      RDDS_ENVIRONMENT: ${RDDS_ENVIRONMENT:-development}
      RDDS_LOG_LEVEL: ${RDDS_LOG_LEVEL:-INFO}
      RDDS_DB_HOST: database
      RDDS_DB_PORT: 5432
      RDDS_DB_NAME: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      RDDS_DB_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      RDDS_DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      RDDS_INGEST_TOKEN: ${RDDS_INGEST_TOKEN:?Set RDDS_INGEST_TOKEN in .env}
      RDDS_ALLOW_LEGACY_INGEST: ${RDDS_ALLOW_LEGACY_INGEST:-true}
      RDDS_SESSION_COOKIE_SECURE: ${RDDS_SESSION_COOKIE_SECURE:-false}
      RDDS_SESSION_IDLE_SECONDS: ${RDDS_SESSION_IDLE_SECONDS:-1800}
      RDDS_SESSION_ABSOLUTE_SECONDS: ${RDDS_SESSION_ABSOLUTE_SECONDS:-28800}
      RDDS_LOGIN_MAX_FAILURES: ${RDDS_LOGIN_MAX_FAILURES:-5}
      RDDS_LOGIN_LOCK_SECONDS: ${RDDS_LOGIN_LOCK_SECONDS:-900}
      RDDS_SECURITY_FAILURE_WINDOW_MINUTES: ${RDDS_SECURITY_FAILURE_WINDOW_MINUTES:-15}
      RDDS_SECURITY_FAILURE_ALERT_COUNT: ${RDDS_SECURITY_FAILURE_ALERT_COUNT:-5}
      RDDS_SENSOR_OFFLINE_AFTER_SECONDS: ${RDDS_SENSOR_OFFLINE_AFTER_SECONDS:-30}
      RDDS_SENSOR_QUEUE_WARNING_MESSAGES: ${RDDS_SENSOR_QUEUE_WARNING_MESSAGES:-100}
      RDDS_SENSOR_SOURCE_SILENT_AFTER_SECONDS: ${RDDS_SENSOR_SOURCE_SILENT_AFTER_SECONDS:-90}
      RDDS_RETENTION_ENABLED: ${RDDS_RETENTION_ENABLED:-false}
      RDDS_MAINTENANCE_INTERVAL_SECONDS: ${RDDS_MAINTENANCE_INTERVAL_SECONDS:-86400}
      RDDS_RETENTION_BATCH_SIZE: ${RDDS_RETENTION_BATCH_SIZE:-10000}
      RDDS_RETENTION_SESSIONS_DAYS: ${RDDS_RETENTION_SESSIONS_DAYS:-30}
      RDDS_RETENTION_SECURITY_EVENTS_DAYS: ${RDDS_RETENTION_SECURITY_EVENTS_DAYS:-180}
      RDDS_RETENTION_HEARTBEATS_DAYS: ${RDDS_RETENTION_HEARTBEATS_DAYS:-30}
      RDDS_RETENTION_OBSERVATIONS_DAYS: ${RDDS_RETENTION_OBSERVATIONS_DAYS:-90}
      RDDS_RETENTION_AUDIT_DAYS: ${RDDS_RETENTION_AUDIT_DAYS:-365}
      RDDS_RETENTION_ALERTS_DAYS: ${RDDS_RETENTION_ALERTS_DAYS:-365}
      RDDS_RETENTION_TRACKS_DAYS: ${RDDS_RETENTION_TRACKS_DAYS:-365}
      RDDS_DATABASE_CAPACITY_GB: ${RDDS_DATABASE_CAPACITY_GB:-0}
      RDDS_DATABASE_WARNING_PERCENT: ${RDDS_DATABASE_WARNING_PERCENT:-70}
      RDDS_DATABASE_CRITICAL_PERCENT: ${RDDS_DATABASE_CRITICAL_PERCENT:-85}
    depends_on:
      database:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - "${RDDS_BIND_ADDRESS:-0.0.0.0}:${RDDS_HTTP_PORT:-8000}:8000"
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/live', timeout=2)
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - backend

  tracker:
    build:
      context: ./server/api
    command:
      - python
      - -m
      - app.tracker
    restart: unless-stopped
    environment:
      RDDS_ENVIRONMENT: ${RDDS_ENVIRONMENT:-development}
      RDDS_LOG_LEVEL: ${RDDS_LOG_LEVEL:-INFO}
      RDDS_DB_HOST: database
      RDDS_DB_PORT: 5432
      RDDS_DB_NAME: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      RDDS_DB_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      RDDS_DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      RDDS_INGEST_TOKEN: ${RDDS_INGEST_TOKEN:?Set RDDS_INGEST_TOKEN in .env}
      RDDS_SENSOR_OFFLINE_AFTER_SECONDS: ${RDDS_SENSOR_OFFLINE_AFTER_SECONDS:-30}
      RDDS_TRACK_POLL_SECONDS: ${RDDS_TRACK_POLL_SECONDS:-1}
      RDDS_TRACK_STALE_AFTER_SECONDS: ${RDDS_TRACK_STALE_AFTER_SECONDS:-15}
      RDDS_TRACK_ENDED_AFTER_SECONDS: ${RDDS_TRACK_ENDED_AFTER_SECONDS:-60}
      RDDS_TRACK_BATCH_SIZE: ${RDDS_TRACK_BATCH_SIZE:-500}
    depends_on:
      database:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - backend

  alert-processor:
    build:
      context: ./server/api
    command:
      - python
      - -m
      - app.alert_processor
    restart: unless-stopped
    environment:
      RDDS_ENVIRONMENT: ${RDDS_ENVIRONMENT:-development}
      RDDS_LOG_LEVEL: ${RDDS_LOG_LEVEL:-INFO}
      RDDS_DB_HOST: database
      RDDS_DB_PORT: 5432
      RDDS_DB_NAME: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      RDDS_DB_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      RDDS_DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      RDDS_INGEST_TOKEN: ${RDDS_INGEST_TOKEN:?Set RDDS_INGEST_TOKEN in .env}
      RDDS_ALERT_POLL_SECONDS: ${RDDS_ALERT_POLL_SECONDS:-1}
    depends_on:
      database:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      tracker:
        condition: service_started
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - backend

  maintenance:
    build:
      context: ./server/api
    command:
      - python
      - -m
      - app.maintenance
    restart: unless-stopped
    environment:
      RDDS_ENVIRONMENT: ${RDDS_ENVIRONMENT:-development}
      RDDS_LOG_LEVEL: ${RDDS_LOG_LEVEL:-INFO}
      RDDS_DB_HOST: database
      RDDS_DB_PORT: 5432
      RDDS_DB_NAME: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      RDDS_DB_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      RDDS_DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      RDDS_INGEST_TOKEN: ${RDDS_INGEST_TOKEN:?Set RDDS_INGEST_TOKEN in .env}
      RDDS_RETENTION_ENABLED: ${RDDS_RETENTION_ENABLED:-false}
      RDDS_MAINTENANCE_INTERVAL_SECONDS: ${RDDS_MAINTENANCE_INTERVAL_SECONDS:-86400}
      RDDS_RETENTION_BATCH_SIZE: ${RDDS_RETENTION_BATCH_SIZE:-10000}
      RDDS_RETENTION_SESSIONS_DAYS: ${RDDS_RETENTION_SESSIONS_DAYS:-30}
      RDDS_RETENTION_SECURITY_EVENTS_DAYS: ${RDDS_RETENTION_SECURITY_EVENTS_DAYS:-180}
      RDDS_RETENTION_HEARTBEATS_DAYS: ${RDDS_RETENTION_HEARTBEATS_DAYS:-30}
      RDDS_RETENTION_OBSERVATIONS_DAYS: ${RDDS_RETENTION_OBSERVATIONS_DAYS:-90}
      RDDS_RETENTION_AUDIT_DAYS: ${RDDS_RETENTION_AUDIT_DAYS:-365}
      RDDS_RETENTION_ALERTS_DAYS: ${RDDS_RETENTION_ALERTS_DAYS:-365}
      RDDS_RETENTION_TRACKS_DAYS: ${RDDS_RETENTION_TRACKS_DAYS:-365}
    depends_on:
      database:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - backend

  backup:
    build:
      context: ./operations
    restart: unless-stopped
    user: "${RDDS_OPERATIONS_UID:-1000}:${RDDS_OPERATIONS_GID:-1000}"
    environment:
      PGHOST: database
      PGPORT: 5432
      PGDATABASE: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      PGUSER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      RDDS_BACKUP_DIRECTORY: /backups
      RDDS_BACKUP_INTERVAL_SECONDS: ${RDDS_BACKUP_INTERVAL_SECONDS:-86400}
      RDDS_BACKUP_RETENTION_DAYS: ${RDDS_BACKUP_RETENTION_DAYS:-30}
    volumes:
      - ${RDDS_BACKUP_PATH:-./backups}:/backups
    depends_on:
      database:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test:
        - CMD
        - /usr/local/bin/backup-health.sh
      interval: 5m
      timeout: 5s
      retries: 3
      start_period: 5m
    networks:
      - backend

  restore:
    profiles:
      - restore
    build:
      context: ./operations
    entrypoint:
      - /usr/local/bin/restore.sh
    restart: "no"
    user: "${RDDS_OPERATIONS_UID:-1000}:${RDDS_OPERATIONS_GID:-1000}"
    environment:
      PGHOST: database
      PGPORT: 5432
      PGDATABASE: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      PGUSER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      RDDS_BACKUP_DIRECTORY: /backups
      RDDS_RESTORE_FILE: ${RDDS_RESTORE_FILE:-}
      RDDS_RESTORE_CONFIRM: ${RDDS_RESTORE_CONFIRM:-}
    volumes:
      - ${RDDS_BACKUP_PATH:-./backups}:/backups:ro
    depends_on:
      database:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - backend

  web:
    build:
      context: ./web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${RDDS_WEB_BIND_ADDRESS:-0.0.0.0}:${RDDS_WEB_PORT:-8080}:8080"
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test:
        - CMD
        - wget
        - -q
        - -O
        - /dev/null
        - http://127.0.0.1:8080/healthz
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - backend

  gateway:
    profiles:
      - tls
    build:
      context: ./gateway
    restart: unless-stopped
    user: "${RDDS_GATEWAY_UID:-1000}:${RDDS_GATEWAY_GID:-1000}"
    depends_on:
      web:
        condition: service_healthy
    ports:
      - "${RDDS_HTTPS_BIND_ADDRESS:-0.0.0.0}:${RDDS_HTTPS_PORT:-8443}:8443"
    volumes:
      - ${RDDS_TLS_CERT_FILE:-./gateway/certs/tls.crt}:/run/rdds-tls/tls.crt:ro
      - ${RDDS_TLS_KEY_FILE:-./gateway/certs/tls.key}:/run/rdds-tls/tls.key:ro
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test:
        - CMD
        - wget
        - --no-check-certificate
        - -q
        - -O
        - /dev/null
        - https://127.0.0.1:8443/healthz
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - backend

  simulator:
    profiles:
      - simulation
    build:
      context: ./simulator
    restart: unless-stopped
    environment:
      RDDS_API_URL: http://api:8000
      RDDS_INGEST_TOKEN: ${RDDS_INGEST_TOKEN:?Set RDDS_INGEST_TOKEN in .env}
      RDDS_SIM_SENSOR_TOKENS_JSON: '${RDDS_SIM_SENSOR_TOKENS_JSON:-}'
      RDDS_SIM_CENTER_LAT: ${RDDS_SIM_CENTER_LAT:-52.229700}
      RDDS_SIM_CENTER_LON: ${RDDS_SIM_CENTER_LON:-21.012200}
      RDDS_SIM_INTERVAL_SECONDS: ${RDDS_SIM_INTERVAL_SECONDS:-2}
    depends_on:
      api:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:size=8m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - backend

  skyspy-emulator:
    profiles:
      - skyspy-emulation
    build:
      context: ./skyspy-emulator
    restart: unless-stopped
    environment:
      RDDS_SKYSPY_EMULATOR_PORT: 7000
      RDDS_SKYSPY_EMULATOR_INTERVAL_SECONDS: ${RDDS_SKYSPY_EMULATOR_INTERVAL_SECONDS:-1}
      RDDS_SKYSPY_EMULATOR_CENTER_LAT: ${RDDS_SKYSPY_EMULATOR_CENTER_LAT:-52.229700}
      RDDS_SKYSPY_EMULATOR_CENTER_LON: ${RDDS_SKYSPY_EMULATOR_CENTER_LON:-21.012200}
      RDDS_SKYSPY_EMULATOR_FAULT_MODE: ${RDDS_SKYSPY_EMULATOR_FAULT_MODE:-normal}
      RDDS_SKYSPY_EMULATOR_DISCONNECT_AFTER_MESSAGES: ${RDDS_SKYSPY_EMULATOR_DISCONNECT_AFTER_MESSAGES:-20}
    read_only: true
    tmpfs:
      - /tmp:size=8m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - backend

  sensor-agent-emulator:
    <<: *sensor-agent-service
    profiles:
      - skyspy-emulation
    environment:
      <<: *sensor-agent-environment
      RDDS_SKYSPY_SOURCE: socket://skyspy-emulator:7000
    volumes:
      - rdds-sensor-agent-emulator-data:/var/lib/rdds-agent
    depends_on:
      api:
        condition: service_healthy
      skyspy-emulator:
        condition: service_started

  sensor-agent:
    <<: *sensor-agent-service
    profiles:
      - skyspy-hardware
    environment:
      <<: *sensor-agent-environment
      RDDS_SKYSPY_SOURCE: ${RDDS_SKYSPY_DEVICE:-/dev/ttyACM0}
    devices:
      - ${RDDS_SKYSPY_DEVICE:-/dev/ttyACM0}:${RDDS_SKYSPY_DEVICE:-/dev/ttyACM0}
    volumes:
      - rdds-sensor-agent-data:/var/lib/rdds-agent
    depends_on:
      api:
        condition: service_healthy

networks:
  backend:
    name: rdds-backend
    driver: bridge

volumes:
  rdds-database-data:
    name: rdds-database-data
  rdds-sensor-agent-data:
    name: rdds-sensor-agent-data
  rdds-sensor-agent-emulator-data:
    name: rdds-sensor-agent-emulator-data
