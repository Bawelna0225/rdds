name: rdds

services:
  database:
    image: postgis/postgis:16-3.5-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - rdds-database-data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    networks:
      - backend

  migrate:
    image: postgis/postgis:16-3.5-alpine
    restart: "no"
    environment:
      PGHOST: database
      PGPORT: 5432
      PGDATABASE: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      PGUSER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - ./database/migrations:/migrations:ro
    entrypoint:
      - /bin/sh
      - -ec
    command:
      - |
        for migration in /migrations/*.sql; do
          echo "Applying $${migration}"
          psql -v ON_ERROR_STOP=1 -f "$${migration}"
        done
    depends_on:
      database:
        condition: service_healthy
    networks:
      - backend

  api:
    build:
      context: ./server/api
    restart: unless-stopped
    environment:
      RDDS_ENVIRONMENT: ${RDDS_ENVIRONMENT:-development}
      RDDS_LOG_LEVEL: ${RDDS_LOG_LEVEL:-INFO}
      RDDS_DB_HOST: database
      RDDS_DB_PORT: 5432
      RDDS_DB_NAME: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      RDDS_DB_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      RDDS_DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      RDDS_INGEST_TOKEN: ${RDDS_INGEST_TOKEN:?Set RDDS_INGEST_TOKEN in .env}
      RDDS_SENSOR_OFFLINE_AFTER_SECONDS: ${RDDS_SENSOR_OFFLINE_AFTER_SECONDS:-30}
    depends_on:
      database:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - "${RDDS_BIND_ADDRESS:-0.0.0.0}:${RDDS_HTTP_PORT:-8000}:8000"
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/live', timeout=2)
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - backend

  tracker:
    build:
      context: ./server/api
    command:
      - python
      - -m
      - app.tracker
    restart: unless-stopped
    environment:
      RDDS_ENVIRONMENT: ${RDDS_ENVIRONMENT:-development}
      RDDS_LOG_LEVEL: ${RDDS_LOG_LEVEL:-INFO}
      RDDS_DB_HOST: database
      RDDS_DB_PORT: 5432
      RDDS_DB_NAME: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      RDDS_DB_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      RDDS_DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      RDDS_INGEST_TOKEN: ${RDDS_INGEST_TOKEN:?Set RDDS_INGEST_TOKEN in .env}
      RDDS_SENSOR_OFFLINE_AFTER_SECONDS: ${RDDS_SENSOR_OFFLINE_AFTER_SECONDS:-30}
      RDDS_TRACK_POLL_SECONDS: ${RDDS_TRACK_POLL_SECONDS:-1}
      RDDS_TRACK_STALE_AFTER_SECONDS: ${RDDS_TRACK_STALE_AFTER_SECONDS:-15}
      RDDS_TRACK_ENDED_AFTER_SECONDS: ${RDDS_TRACK_ENDED_AFTER_SECONDS:-60}
      RDDS_TRACK_BATCH_SIZE: ${RDDS_TRACK_BATCH_SIZE:-500}
    depends_on:
      database:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - backend

  web:
    build:
      context: ./web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${RDDS_WEB_BIND_ADDRESS:-0.0.0.0}:${RDDS_WEB_PORT:-8080}:8080"
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test:
        - CMD
        - wget
        - -q
        - -O
        - /dev/null
        - http://127.0.0.1:8080/healthz
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - backend

  simulator:
    profiles:
      - simulation
    build:
      context: ./simulator
    restart: unless-stopped
    environment:
      RDDS_API_URL: http://api:8000
      RDDS_INGEST_TOKEN: ${RDDS_INGEST_TOKEN:?Set RDDS_INGEST_TOKEN in .env}
      RDDS_SIM_CENTER_LAT: ${RDDS_SIM_CENTER_LAT:-52.229700}
      RDDS_SIM_CENTER_LON: ${RDDS_SIM_CENTER_LON:-21.012200}
      RDDS_SIM_INTERVAL_SECONDS: ${RDDS_SIM_INTERVAL_SECONDS:-2}
    depends_on:
      api:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:size=8m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - backend

networks:
  backend:
    name: rdds-backend
    driver: bridge

volumes:
  rdds-database-data:
    name: rdds-database-data
