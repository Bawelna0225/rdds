name: rdds

services:
  database:
    image: postgis/postgis:16-3.5-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - rdds-database-data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    networks:
      - backend

  api:
    build:
      context: ./server/api
    restart: unless-stopped
    environment:
      RDDS_ENVIRONMENT: ${RDDS_ENVIRONMENT:-development}
      RDDS_LOG_LEVEL: ${RDDS_LOG_LEVEL:-INFO}
      RDDS_DB_HOST: database
      RDDS_DB_PORT: 5432
      RDDS_DB_NAME: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      RDDS_DB_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      RDDS_DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    depends_on:
      database:
        condition: service_healthy
    ports:
      - "${RDDS_BIND_ADDRESS:-0.0.0.0}:${RDDS_HTTP_PORT:-8000}:8000"
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/live', timeout=2)
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - backend

networks:
  backend:
    name: rdds-backend
    driver: bridge

volumes:
  rdds-database-data:
    name: rdds-database-data
